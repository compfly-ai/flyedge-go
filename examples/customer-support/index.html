<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Support Go [Local] Agent</title>
<style>
:root{font-family:system-ui,sans-serif;color:#15363a;background:#f2f7f7}*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:820px;margin:auto;background:white;border:1px solid #d7e4e4;border-radius:16px;overflow:hidden}header{background:#086e68;color:white;padding:22px;display:flex;justify-content:space-between;gap:16px;align-items:center}h1{font-size:20px;margin:0 0 5px}header p{font-size:13px;margin:0;opacity:.9}button{font:inherit;cursor:pointer;border:1px solid #bed4d3;border-radius:9px;padding:10px 14px;background:white;color:#155954}button:disabled{opacity:.5;cursor:wait}#messages{min-height:380px;max-height:62vh;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px}.bubble{padding:13px 16px;border-radius:12px;max-width:90%;background:#eff6f5;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}.user{background:#dceafc;align-self:flex-end}.blocked{border-left:4px solid #b33a32;background:#fff1ef}.hint{color:#62797a;font-size:13px}.tool{font-size:12px;color:#587b77}form{padding:18px;border-top:1px solid #e0e9e9}textarea{font:inherit;width:100%;resize:vertical;min-height:70px;border:1px solid #abc6c3;border-radius:9px;padding:12px}.actions{display:flex;align-items:center;gap:10px;margin-top:10px}#send{margin-left:auto;background:#086e68;color:white;border-color:#086e68}#files{display:flex;gap:6px;flex-wrap:wrap}#files button{font-size:12px;margin-bottom:10px}#error{color:#a32e26;font-size:13px;min-height:20px}#status{font-size:12px;color:#517875}input[type=file]{position:absolute;width:1px;height:1px;opacity:0}</style></head>
<body><main><header><div><h1>Customer Support Go [Local] Agent</h1><p>Synthetic shop · OpenAI gpt-4o-mini · CompFly protected</p></div><button id="new" type="button">New chat</button></header>
<section id="messages" aria-label="Conversation" aria-live="polite"><div class="hint">Ask about demo order DEMO-1001, returns, or attach an image/PDF.</div></section>
<form id="chat"><div id="files"></div><label for="message" class="hint">Your message</label><textarea id="message" placeholder="How can I help with your order?"></textarea><div id="error" role="alert"></div><div class="actions"><input id="upload" type="file" accept="image/png,image/jpeg,application/pdf" multiple><button id="attach" type="button" aria-label="Attach images or PDFs">＋ Attach</button><span id="status">Up to 10 files · 10 MiB total</span><button id="send" type="submit">Send</button></div></form></main>
<script>
const $=id=>document.getElementById(id);let files=[],busy=false,newChat=false;
function bubble(text,kind=''){const node=document.createElement('div');node.className='bubble '+kind;node.textContent=text;$('messages').append(node);node.scrollIntoView({block:'nearest'});}
function renderFiles(){$('files').replaceChildren();files.forEach((f,i)=>{const b=document.createElement('button');b.type='button';b.textContent=f.name+' ×';b.setAttribute('aria-label','Remove '+f.name);b.disabled=busy;b.onclick=()=>{files.splice(i,1);renderFiles()};$('files').append(b)});}
$('attach').onclick=()=>$('upload').click();
$('upload').onchange=()=>{const chosen=[...files,...$('upload').files];$('upload').value='';if(chosen.length>10||chosen.reduce((n,f)=>n+f.size,0)>10*1024*1024){$('error').textContent='Use up to 10 files, totaling at most 10 MiB.';return}if(chosen.some(f=>!['image/png','image/jpeg','application/pdf'].includes(f.type))){$('error').textContent='Only PNG, JPEG and PDF files are supported.';return}files=chosen;$('error').textContent='';renderFiles()};
$('new').onclick=()=>{if(busy)return;newChat=true;files=[];renderFiles();$('message').value='';$('error').textContent='';$('messages').replaceChildren();};
function encoded(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve({name:file.name,media_type:file.type,data_base64:String(r.result).split(',')[1]});r.onerror=()=>reject(new Error('Unable to read file.'));r.readAsDataURL(file)})}
$('chat').onsubmit=async event=>{event.preventDefault();if(busy)return;const text=$('message').value.trim();if(!text&&!files.length)return;busy=true;['send','attach','new'].forEach(id=>$(id).disabled=true);$('message').disabled=true;renderFiles();$('error').textContent='';$('status').textContent='Checking and preparing reply…';try{const attachments=await Promise.all(files.map(encoded));bubble([text,...files.map(f=>'📎 '+f.name)].filter(Boolean).join('\n'),'user');const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,attachments,new:newChat})});const result=await res.json();if(!res.ok||result.error)throw new Error(result.error||'Request failed.');bubble(result.message,result.blocked?'blocked':'');if(result.tools?.length){const t=document.createElement('div');t.className='tool';t.textContent='Tools used: '+result.tools.join(', ');$('messages').append(t)}newChat=false;files=[];renderFiles();$('message').value='';}catch(error){$('error').textContent=error.message;}finally{busy=false;['send','attach','new'].forEach(id=>$(id).disabled=false);$('message').disabled=false;renderFiles();$('status').textContent='Up to 10 files · 10 MiB total';}};
</script></body></html>
